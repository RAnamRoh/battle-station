packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# Packages allowed to run install scripts.
onlyBuiltDependencies:
  - esbuild
  - workerd

# One version per dependency across the whole repo. Packages use "catalog:".
catalog:
  typescript: ^6.0.3
  vitest: ^5.1.0
  phaser: 4.2.1
  vite: ^8.3.8
  zod: ^4.6.7
  yaml: ^2.9.1
  tsx: ^4.23.15
  "@types/node": ^22.0.0
  wrangler: ^4.167.0
  "@cloudflare/workers-types": ^5.20261123.1
